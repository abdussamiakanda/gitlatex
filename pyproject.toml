[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlatex"
dynamic = ["version"]
description = "A simple UI for LaTeX projects with Git support. Clone repos, edit, compile, and push."
readme = "README.md"
license = "ISC"
keywords = ["latex", "git", "ide", "editor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
requires-python = ">=3.8"
dependencies = [
    "flask>=2.0",
    "gitpython>=3.1",
    "symspellpy>=6.7",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/abdussamiakanda/gitlatex"
Documentation = "https://github.com/abdussamiakanda/gitlatex#readme"
Repository = "https://github.com/abdussamiakanda/gitlatex"

[project.scripts]
gitlatex = "gitlatex.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitlatex*"]

[tool.setuptools.package-data]
# public/ is now nested (js/ and css/ subfolders), so list the levels
# explicitly rather than relying on ** being expanded recursively.
gitlatex = [
    "public/*",
    "public/js/*.js",
    "public/js/*/*.js",
    "public/css/*.css",
    # The editor UI, built from web/ by `npm run build` (not in git; CI builds
    # it before packaging), and the manifest of the in-browser TeX engine.
    "ui/*",
    "ui/assets/*",
    "engine/manifest.json",
]

[tool.setuptools.exclude-package-data]
gitlatex = ["ui/assets/*.map"]

[tool.setuptools_scm]
# The version comes from the latest git tag (v1.7.0 -> 1.7.0); untagged commits
# build as dev versions like 1.7.1.dev3+g1a2b3c4.
version_file = "gitlatex/_version.py"
